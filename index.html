<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 數值方法｜每週作業紀錄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F6F9;--text:#14161F;--mute:#5A5F72;--line:#D3D6E0;--ac:#3D3BF3;--ok:#0A8F7E;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1118;--text:#ECEEF5;--mute:#9AA0B8;--line:#272B3B;--ac:#9594FF;--ok:#4FD6C3}}
:root[data-theme="dark"]{--bg:#0F1118;--text:#ECEEF5;--mute:#9AA0B8;--line:#272B3B;--ac:#9594FF;--ok:#4FD6C3}
html{scroll-padding-top:calc(64px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--text);font:400 1rem/1.8 "Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
.bar-in,.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
.bar-in{display:flex;justify-content:space-between;align-items:center;height:52px;font-size:.95rem}
.bar a{color:var(--mute);text-decoration:none}
.bar a:hover{color:var(--ac)}
.hero{display:grid;gap:36px;align-items:center;padding:56px 0 48px}
@media(min-width:820px){.hero{padding:84px 0 64px}}
h1{font:700 clamp(2.6rem,8vw,4.8rem)/1.08 "Space Grotesk","Noto Sans TC",sans-serif;margin:0 0 16px;letter-spacing:-.01em}
.sid{margin:0 0 8px;color:var(--mute);font-variant-numeric:tabular-nums}
.lead{max-width:28em;color:var(--mute);margin:0}
section{padding:48px 0 64px;border-top:1px solid var(--line)}
h2{font:700 1.7rem/1.3 "Space Grotesk","Noto Sans TC",sans-serif;margin:0 0 8px}
.note{color:var(--mute);margin:0 0 28px;font-size:.95rem}
.hw{list-style:none;margin:0;padding:0}
.hw li{display:grid;grid-template-columns:3.2rem 1fr;gap:4px 16px;padding:18px 0;border-bottom:1px solid var(--line)}
@media(min-width:720px){.hw li{grid-template-columns:4.5rem 1fr auto;align-items:baseline}}
.wk{font:700 2rem/1 "Space Grotesk",sans-serif;color:var(--ac)}
.tt{font-weight:500;font-size:1.1rem}
.tg{grid-column:2;color:var(--mute);font-size:.9rem}
@media(min-width:720px){.tg{grid-column:auto}}
footer{border-top:1px solid var(--line);padding:24px 0 32px;font-size:.85rem;color:var(--mute)}
</style>
</head>
<body>
<header class="bar"><div class="bar-in"><span>陳宇恩｜物理系三年級</span><a href="#hw">每週作業</a></div></header>
<main class="wrap">
<div class="hero">
<div>
<h1>AI 數值方法</h1>
<p class="sid">學號 413210112　座號 16</p>
<p class="lead">這裡記錄我在課程中每週完成的作業，以及每一次動手算出來的結果。</p>
</div>
</div>

<section id="hw">
<h2>每週作業</h2>
<p class="note">新的作業會依週次加在這個清單裡。</p>
<ol class="hw" id="list"></ol>
</section>
</main>
<footer><div class="wrap">練習用網頁，由 Claude 協助製作。</div></footer>

<script>
(function(){
/* 每週作業：之後只要改這裡 */
var HW=[
 ["生成個人成果網站","網頁製作","https://claude.ai/artifact/YYxU3Qa5HcP8VsZmtAzW8J"]
];
var list=document.getElementById('list');
HW.forEach(function(h,i){
 var li=document.createElement('li');
 li.innerHTML='<span class="wk">'+(i+1)+'</span><span class="tt"></span><span class="tg"></span>';
 var t=li.children[1];t.textContent='第 '+(i+1)+' 週：'+h[0];
 if(h[2]){var a=document.createElement('a');a.href=h[2];a.target='_blank';a.rel='noopener noreferrer';a.textContent='查看作業網站';a.style.cssText='margin-left:12px;font-size:.9rem;font-weight:400;color:var(--ac)';t.appendChild(a)}
 li.children[2].textContent=h[1];
 list.appendChild(li);
});
})();
</script>
</body>
</html>
